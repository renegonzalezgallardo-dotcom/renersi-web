<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RSI · Test vídeo</title>
<style>
body{font-family:system-ui;background:#111;color:#fff;margin:0;padding:24px}main{max-width:1100px;margin:auto}video{width:100%;max-height:70vh;background:#000}button{margin:8px 8px 0 0;padding:10px 14px}#info{margin-top:14px;font-family:ui-monospace,monospace;white-space:pre-wrap}
</style>
</head>
<body>
<main>
<h1>Test técnico del vídeo RSI</h1>
<p>Esta página no forma parte de la web pública. Sirve solo para comprobar reproducción y saltos de tiempo.</p>
<video id="v" controls preload="auto" playsinline>
  <source src="assets/video/recorrido.mp4" type="video/mp4">
</video>
<div>
<button data-t="0">0 s</button>
<button data-t="5">5 s</button>
<button data-t="10">10 s</button>
<button data-t="15">15 s</button>
<button id="play">Play / Pause</button>
</div>
<div id="info"></div>
<script>
const v=document.getElementById('v');
const info=document.getElementById('info');
function paint(){
  info.textContent=`readyState: ${v.readyState}\nnetworkState: ${v.networkState}\nduration: ${v.duration}\ncurrentTime: ${v.currentTime}\npaused: ${v.paused}\nseeking: ${v.seeking}\nerror: ${v.error ? v.error.code : 'none'}`;
}
['loadedmetadata','loadeddata','canplay','playing','pause','seeking','seeked','timeupdate','error','waiting','stalled'].forEach(e=>v.addEventListener(e,paint));
document.querySelectorAll('[data-t]').forEach(b=>b.addEventListener('click',()=>{v.currentTime=Number(b.dataset.t);paint();}));
document.getElementById('play').addEventListener('click',()=>v.paused?v.play():v.pause());
setInterval(paint,500);paint();
</script>
</main>
</body>
</html>
